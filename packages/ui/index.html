<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DepGraph — Dependency Intelligence Platform</title>
    <meta name="description" content="Graph-powered dependency analysis: visualise, audit, and harden your Node.js projects." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg-void:     #04070d;
        --bg-base:     #080d16;
        --bg-surface:  #0c1220;
        --bg-elevated: #111827;
        --bg-card:     #0f1a2e;
        --border:      #1a2540;
        --border-bright: #243356;

        --text-primary:   #e8eef8;
        --text-secondary: #8b99b8;
        --text-muted:     #4a5880;
        --text-faint:     #2d3d5c;

        --accent-blue:    #4f8ef7;
        --accent-purple:  #a78bfa;
        --accent-cyan:    #22d3ee;
        --accent-green:   #34d399;
        --accent-yellow:  #fbbf24;
        --accent-orange:  #fb923c;
        --accent-red:     #f87171;

        --gradient-brand: linear-gradient(135deg, #4f8ef7 0%, #a78bfa 100%);
        --gradient-glow:  linear-gradient(135deg, #4f8ef720 0%, #a78bfa20 100%);

        --radius-sm:  6px;
        --radius-md:  10px;
        --radius-lg:  14px;
        --radius-xl:  20px;

        --shadow-sm: 0 1px 4px rgba(0,0,0,0.4);
        --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
        --shadow-lg: 0 8px 32px rgba(0,0,0,0.6);
        --shadow-glow-blue: 0 0 20px rgba(79,142,247,0.25);
        --shadow-glow-purple: 0 0 20px rgba(167,139,250,0.25);

        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      }
      html, body, #root {
        height: 100%; width: 100%;
        background: var(--bg-void);
        color: var(--text-primary);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #243356; border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: #324a7a; }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
      @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      @keyframes glow-pulse {
        0%, 100% { box-shadow: 0 0 8px rgba(79,142,247,0.2); }
        50% { box-shadow: 0 0 24px rgba(79,142,247,0.5); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
